[workspace]
resolver = "3"
members = ["crates/ocal-core", "crates/ocal-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
ocal-core = { path = "crates/ocal-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
# Keep GPUI development artifacts small; opt into symbols when debugging.
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.release.package.gpui-pre-macros]
debug-assertions = true
